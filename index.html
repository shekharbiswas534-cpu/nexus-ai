<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI Builder Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans">

  <!-- Header -->
  <header class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900 shadow-md">
    <div class="flex items-center gap-2">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="text-base md:text-xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
        Nexus AI Builder Pro
      </span>
    </div>

    <!-- Actions & Auth -->
    <div class="flex items-center gap-2">
      <button onclick="openFullscreenModal()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow">
        <i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">Preview</span>
      </button>
      <button onclick="setApiKey()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700">
        🔑 Key
      </button>
      
      <!-- User Profile / Login -->
      <div id="authSection" class="flex items-center gap-1.5">
        <button id="loginPromptBtn" onclick="promptGoogleLogin()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1">
          <i class="fa-brands fa-google"></i> Login
        </button>
        <div id="userProfile" class="hidden flex items-center gap-2 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
          <img id="userAvatar" src="" class="w-6 h-6 rounded-full border border-blue-400">
          <span id="userName" class="text-xs max-w-[70px] truncate hidden sm:inline"></span>
          <button onclick="logoutGoogle()" title="Logout" class="text-xs text-rose-400 hover:text-rose-300 ml-1">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- History Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-slate-800 flex flex-col transform -translate-x-full transition-transform duration-200 ease-in-out md:relative md:translate-x-0">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center">
        <button onclick="startNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow">
          <i class="fa-solid fa-plus"></i> New Chat
        </button>
        <button onclick="toggleSidebar()" class="md:hidden ml-2 p-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1.5" id="chatHistoryList"></div>

      <div class="p-2 border-t border-slate-800">
        <button onclick="clearAllHistory()" class="w-full text-xs text-rose-400 hover:text-rose-300 py-1.5 rounded flex items-center justify-center gap-1">
          <i class="fa-solid fa-trash"></i> Clear History
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden w-full">
      
      <!-- Chat Interface -->
      <div class="flex-1 flex flex-col h-1/2 md:h-full border-r border-slate-800 bg-slate-950">
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <!-- Dynamic Thinking / Status Tracker -->
        <div id="statusTracker" class="hidden px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center gap-2 text-xs text-blue-400 font-mono">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="statusText">Thinking...</span>
        </div>

        <!-- Input Box & Image Attachment Preview -->
        <div class="p-3 bg-slate-900 border-t border-slate-800">
          <div id="attachmentPreview" class="hidden mb-2 relative inline-block">
            <img id="previewImg" class="h-16 w-16 object-cover rounded-lg border border-blue-500 shadow">
            <button onclick="removeAttachment()" class="absolute -top-1.5 -right-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">
              &times;
            </button>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl border border-slate-700 flex items-center justify-center">
              <i class="fa-solid fa-paperclip"></i>
              <input type="file" id="mediaUpload" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            </label>
            <textarea id="userInput" rows="2" placeholder="Apna idea, sawal ya requirement likhein..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
            <button id="sendBtn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl font-medium text-sm transition h-full flex items-center justify-center">Send</button>
          </div>
        </div>
      </div>

      <!-- Sandbox Panel -->
      <div class="flex-1 flex flex-col h-1/2 md:h-full bg-slate-900 border-t md:border-t-0 border-slate-800">
        <div class="p-2 border-b border-slate-800 flex justify-between items-center bg-slate-950 px-3">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Live Code Sandbox</span>
          <div class="flex gap-2">
            <button onclick="runCode()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-2.5 py-1 rounded">
              ▶ Run
            </button>
            <button onclick="openFullscreenModal()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded">
              <i class="fa-solid fa-desktop"></i> Fullscreen
            </button>
          </div>
        </div>
        <textarea id="codeEditor" class="h-1/3 bg-slate-950 p-2.5 text-xs font-mono text-emerald-400 border-none outline-none resize-none" placeholder="HTML / App code yahan paste karke Run karein..."></textarea>
        <iframe id="previewFrame" class="flex-1 w-full bg-white border-t border-slate-800"></iframe>
      </div>
    </div>
  </div>

  <!-- Fullscreen Desktop Preview Modal (With ❌ Button) -->
  <div id="fullscreenModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm hidden flex flex-col p-2 md:p-6">
    <div class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      <div class="bg-slate-800 px-4 py-2.5 border-b border-slate-700 flex justify-between items-center select-none">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
          <span class="ml-2 text-xs text-slate-300 font-mono flex items-center gap-1 bg-slate-950/50 px-3 py-1 rounded-md border border-slate-700/60">
            <i class="fa-solid fa-globe text-slate-400 text-[10px]"></i> live-preview://nexus-app
          </span>
        </div>
        <button onclick="closeFullscreenModal()" class="text-slate-400 hover:text-white bg-slate-700 hover:bg-rose-600 p-1.5 px-2.5 rounded-lg transition">
          <i class="fa-solid fa-xmark text-sm font-bold"></i>
        </button>
      </div>
      <iframe id="modalPreviewFrame" class="w-full flex-1 bg-white border-none"></iframe>
    </div>
  </div>

  <script>
    let geminiKey = localStorage.getItem('GEMINI_KEY') || '';
    let currentUser = JSON.parse(localStorage.getItem('NEXUS_USER') || 'null');
    let sessions = [];
    let currentSessionId = null;
    let currentAttachedBase64 = null;
    let currentAttachedMime = null;

    function getStorageKey() {
      return currentUser ? `NEXUS_SESSIONS_${currentUser.email}` : 'NEXUS_SESSIONS_GUEST';
    }

    function init() {
      renderAuthUI();
      loadUserSessions();
    }

    function renderAuthUI() {
      const loginBtn = document.getElementById('loginPromptBtn');
      const profile = document.getElementById('userProfile');
      if (currentUser) {
        loginBtn.classList.add('hidden');
        profile.classList.remove('hidden');
        document.getElementById('userName').innerText = currentUser.name.split(' ')[0];
        document.getElementById('userAvatar').src = currentUser.picture || 'https://via.placeholder.com/40';
      } else {
        loginBtn.classList.remove('hidden');
        profile.classList.add('hidden');
      }
    }

    function promptGoogleLogin() {
      const email = prompt("Apna Gmail ID likhein jisse aapki chats private aur safe rahein:");
      if (email && email.includes('@')) {
        currentUser = {
          name: email.split('@')[0],
          email: email.trim().toLowerCase(),
          picture: 'https://ui-avatars.com/api/?background=2563eb&color=fff&name=' + encodeURIComponent(email)
        };
        localStorage.setItem('NEXUS_USER', JSON.stringify(currentUser));
        renderAuthUI();
        loadUserSessions();
        alert("Logged in as: " + currentUser.email);
      }
    }

    function logoutGoogle() {
      if (confirm("Kya aap logout karna chahte hain?")) {
        localStorage.removeItem('NEXUS_USER');
        currentUser = null;
        renderAuthUI();
        loadUserSessions();
      }
    }

    function loadUserSessions() {
      const key = getStorageKey();
      sessions = JSON.parse(localStorage.getItem(key) || '[]');
      if (sessions.length === 0) {
        startNewChat();
      } else {
        currentSessionId = sessions[0].id;
        renderSidebar();
        loadSession(currentSessionId);
      }
    }

    function saveSessions() {
      localStorage.setItem(getStorageKey(), JSON.stringify(sessions));
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function startNewChat() {
      const newId = 'session_' + Date.now();
      const newSession = {
        id: newId,
        title: 'New Conversation',
        messages: [{
          sender: 'bot',
          text: '👋 Namaste! Main aapka Nexus AI Builder Pro hoon. Mujhe apna idea batayein, photo upload karein ya coding/business par research karein!'
        }]
      };
      sessions.unshift(newSession);
      currentSessionId = newId;
      saveSessions();
      renderSidebar();
      loadSession(newId);
    }

    function renderSidebar() {
      const container = document.getElementById('chatHistoryList');
      container.innerHTML = '';
      sessions.forEach(session => {
        const item = document.createElement('div');
        const isActive = session.id === currentSessionId;
        item.className = `p-2 rounded-lg text-xs cursor-pointer flex justify-between items-center group transition ${isActive ? 'bg-blue-600 text-white font-medium' : 'text-slate-300 hover:bg-slate-800'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'truncate flex-1 mr-2';
        titleSpan.innerText = session.title || 'Untitled Chat';
        titleSpan.onclick = () => {
          loadSession(session.id);
          if (window.innerWidth < 768) toggleSidebar();
        };

        const delBtn = document.createElement('button');
        delBtn.innerHTML = '<i class="fa-solid fa-trash-can opacity-60 hover:opacity-100"></i>';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteSession(session.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        container.appendChild(item);
      });
    }

    function loadSession(id) {
      currentSessionId = id;
      renderSidebar();
      const session = sessions.find(s => s.id === id);
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      if (session) {
        session.messages.forEach((msg, index) => appendMessageUI(msg.text, msg.sender, index, msg.image));
      }
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      if (sessions.length === 0) {
        startNewChat();
      } else {
        currentSessionId = sessions[0].id;
        saveSessions();
        renderSidebar();
        loadSession(currentSessionId);
      }
    }

    function clearAllHistory() {
      if (confirm("Kya aap apni saari chats delete karna chahte hain?")) {
        sessions = [];
        saveSessions();
        startNewChat();
      }
    }

    function setApiKey() {
      const key = prompt("Apni Gemini API Key paste karein:", geminiKey);
      if (key !== null) {
        geminiKey = key.trim();
        localStorage.setItem('GEMINI_KEY', geminiKey);
        alert("API Key save ho gayi!");
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const fullBase64 = e.target.result;
        currentAttachedMime = file.type;
        currentAttachedBase64 = fullBase64.split(',')[1];
        document.getElementById('previewImg').src = fullBase64;
        document.getElementById('attachmentPreview').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeAttachment() {
      currentAttachedBase64 = null;
      currentAttachedMime = null;
      document.getElementById('attachmentPreview').classList.add('hidden');
      document.getElementById('mediaUpload').value = '';
    }

    function editMessage(index) {
      const activeSession = sessions.find(s => s.id === currentSessionId);
      if (!activeSession) return;
      const msg = activeSession.messages[index];
      if (msg && msg.sender === 'user') {
        document.getElementById('userInput').value = msg.text;
        activeSession.messages.splice(index);
        saveSessions();
        loadSession(currentSessionId);
        document.getElementById('userInput').focus();
      }
    }

    async function setStatusMessage(text) {
      const tracker = document.getElementById('statusTracker');
      const label = document.getElementById('statusText');
      tracker.classList.remove('hidden');
      label.innerText = text;
    }

    function hideStatus() {
      document.getElementById('statusTracker').classList.add('hidden');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      const attachedImg = currentAttachedBase64;
      const attachedMime = currentAttachedMime;

      if (!text && !attachedImg) return;

      if (!geminiKey) {
        alert("Pehle API Key set karein!");
        return;
      }

      const activeSession = sessions.find(s => s.id === currentSessionId);
      if (!activeSession) return;

      if (activeSession.messages.filter(m => m.sender === 'user').length === 0) {
        activeSession.title = (text || "Image Query").length > 25 ? (text || "Image Query").substring(0, 25) + '...' : (text || "Image Query");
        renderSidebar();
      }

      // Add user message with image memory
      const userMsgObj = { sender: 'user', text: text || '[Sent Image]' };
      if (attachedImg) {
        userMsgObj.image = `data:${attachedMime};base64,${attachedImg}`;
      }
      activeSession.messages.push(userMsgObj);
      appendMessageUI(userMsgObj.text, 'user', activeSession.messages.length - 1, userMsgObj.image);

      input.value = '';
      removeAttachment();
      sendBtn.disabled = true;
      sendBtn.innerText = '...';

      // Animated multi-step status indicator
      setStatusMessage("Reading request & analyzing intent...");
      setTimeout(() => setStatusMessage("Analyzing multimodal context & structure..."), 600);
      setTimeout(() => setStatusMessage("Designing clean architecture & logic..."), 1300);

      const systemInstruction = `You are Nexus AI Builder Pro, an elite software architect and AI developer.
Your expertise spans: HTML5, CSS3, Modern Tailwind CSS, JavaScript (ES6+), Python, React, Node.js, API Architecture, Business Planning, and UI/UX.

BEHAVIOR RULES:
1. EXCELLENT COMMUNICATOR & RESEARCHER: Explain clearly in natural Hinglish/Hindi. If user asks for business, research, or complex tools, break it down step-by-step.
2. NO WATERMARKS & PROFESSIONAL DESIGN: Always provide clean, highly polished modern UI (glassmorphism/sleek dark/modern SaaS designs) without generic placeholders or watermarks.
3. CODE FORMAT: When providing web apps, tools or code, ALWAYS wrap the runnable, standalone single-file code strictly in \`\`\`html ... \`\`\` so the user can run it live and copy it with 1 click.
4. ROADMAP: Always conclude your response with a clear "Next Steps / Deployment Guide" telling the user where to paste the code, how to push to GitHub, or how to test.`;

      // Build Multi-turn Memory Payload
      const contentsPayload = [];
      const historyContext = activeSession.messages.slice(-8); // Keep last 8 messages for sharp memory

      historyContext.forEach(m => {
        const parts = [{ text: (m.sender === 'user' ? "User: " : "Model: ") + m.text }];
        if (m.sender === 'user' && m.image) {
          const partsArr = m.image.split(',');
          const mime = partsArr[0].match(/:(.*?);/)[1];
          parts.push({
            inline_data: {
              mime_type: mime,
              data: partsArr[1]
            }
          });
        }
        contentsPayload.push({
          role: m.sender === 'user' ? 'user' : 'model',
          parts: parts
        });
      });

      // Target Google Gemini Models
      const targetModels = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.7-flash'];
      let done = false;

      for (const m of targetModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${geminiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: systemInstruction }] },
              contents: contentsPayload
            })
          });

          const data = await res.json();
          if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            const botReply = data.candidates[0].content.parts[0].text;
            activeSession.messages.push({ sender: 'bot', text: botReply });
            saveSessions();
            appendMessageUI(botReply, 'bot', activeSession.messages.length - 1);
            extractAndAutoFillCode(botReply);
            done = true;
            break;
          }
        } catch (e) {
          console.error(e);
        }
      }

      hideStatus();

      if (!done) {
        const errorMsg = "Google server par abhi traffic spike hai. Kripya 15-20 second baad dubara Send karein.";
        activeSession.messages.push({ sender: 'bot', text: errorMsg });
        saveSessions();
        appendMessageUI(errorMsg, 'bot', activeSession.messages.length - 1);
      }

      sendBtn.disabled = false;
      sendBtn.innerText = 'Send';
    }

    function appendMessageUI(content, sender, index, imageUri) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? "ml-auto p-3 rounded-xl bg-blue-600 text-white text-sm max-w-[85%] space-y-2 relative group" 
        : "p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm max-w-[90%] space-y-2";

      if (imageUri) {
        const img = document.createElement('img');
        img.src = imageUri;
        img.className = "max-h-48 rounded-lg border border-white/20 mb-1 object-cover";
        div.appendChild(img);
      }

      if (sender === 'user') {
        const textP = document.createElement('p');
        textP.className = "whitespace-pre-wrap leading-relaxed";
        textP.innerText = content;
        div.appendChild(textP);

        // Edit and Copy Controls for User Messages
        const actionRow = document.createElement('div');
        actionRow.className = "flex justify-end gap-2 pt-1 border-t border-white/20 text-[11px] opacity-80 group-hover:opacity-100 transition";
        actionRow.innerHTML = `
          <button onclick="navigator.clipboard.writeText('${content.replace(/'/g, "\\'")}'); alert('Copied!');" class="hover:underline flex items-center gap-1">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
          <button onclick="editMessage(${index})" class="hover:underline flex items-center gap-1">
            <i class="fa-solid fa-pen"></i> Edit
          </button>
        `;
        div.appendChild(actionRow);

      } else {
        // Structured Code Block & Explanations with One-Click Copy
        const parts = content.split(/(```[\s\S]*?```)/g);
        parts.forEach(part => {
          if (part.startsWith('```')) {
            const codeContent = part.replace(/^```[a-zA-Z]*\n?/, '').replace(/```$/, '');
            const blockContainer = document.createElement('div');
            blockContainer.className = "relative rounded-lg overflow-hidden border border-slate-700 bg-slate-950 my-2";

            const topBar = document.createElement('div');
            topBar.className = "flex justify-between items-center px-3 py-1.5 bg-slate-800/80 text-[11px] text-slate-400";
            topBar.innerHTML = `<span>Production Code</span>`;

            const copyBtn = document.createElement('button');
            copyBtn.className = "bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-0.5 rounded flex items-center gap-1 text-[11px] transition";
            copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Code`;
            copyBtn.onclick = () => {
              navigator.clipboard.writeText(codeContent);
              copyBtn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copied!`;
              setTimeout(() => {
                copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Code`;
              }, 2000);
            };

            topBar.appendChild(copyBtn);
            blockContainer.appendChild(topBar);

            const pre = document.createElement('pre');
            pre.className = "p-3 text-xs font-mono text-emerald-400 overflow-x-auto whitespace-pre";
            pre.innerText = codeContent;
            blockContainer.appendChild(pre);

            div.appendChild(blockContainer);
          } else if (part.trim()) {
            const p = document.createElement('p');
            p.className = "whitespace-pre-wrap leading-relaxed";
            p.innerText = part;
            div.appendChild(p);
          }
        });
      }

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function extractAndAutoFillCode(text) {
      const match = text.match(/```html([\s\S]*?)```/i) || text.match(/```([\s\S]*?)```/);
      if (match && match[1]) {
        const cleanCode = match[1].trim();
        document.getElementById('codeEditor').value = cleanCode;
        runCode();
      }
    }

    function runCode() {
      const code = document.getElementById('codeEditor').value;
      const frame = document.getElementById('previewFrame').contentWindow.document;
      frame.open();
      frame.write(code);
      frame.close();
    }

    function openFullscreenModal() {
      const code = document.getElementById('codeEditor').value;
      if (!code) {
        alert("Pehle sandbox mein code generate ya paste karein!");
        return;
      }
      const modal = document.getElementById('fullscreenModal');
      const frame = document.getElementById('modalPreviewFrame').contentWindow.document;
      frame.open();
      frame.write(code);
      frame.close();
      modal.classList.remove('hidden');
    }

    function closeFullscreenModal() {
      document.getElementById('fullscreenModal').classList.add('hidden');
    }

    window.onload = init;
  </script>
</body>
</html>
