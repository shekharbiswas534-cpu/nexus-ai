<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Builder AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans">

  <!-- Header -->
  <header class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900">
    <div class="flex items-center gap-2">
      <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Nexus AI Builder</span>
    </div>
    <button onclick="setApiKey()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
      🔑 Set API Key
    </button>
  </header>

  <!-- Main View -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Chat Section -->
    <div class="flex-1 flex flex-col h-full border-r border-slate-800">
      <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 text-sm max-w-[85%]">
          👋 Namaste! Main aapka <b>Nexus AI Builder</b> hoon. Apna idea likhein aur live code generate karwayein!
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-3 bg-slate-900 border-t border-slate-800">
        <div class="flex gap-2">
          <textarea id="userInput" rows="2" placeholder="Apna idea likhein... (Hinglish/Hindi/English)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
          <button id="sendBtn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl font-medium text-sm transition">Send</button>
        </div>
      </div>
    </div>

    <!-- Code Runner / Sandbox Preview -->
    <div class="h-1/2 md:h-full md:w-1/2 flex flex-col bg-slate-900 border-t md:border-t-0 border-slate-800">
      <div class="p-2 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Live Code Sandbox</span>
        <button onclick="runCode()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1 rounded">▶ Run Code</button>
      </div>
      <textarea id="codeEditor" class="flex-1 bg-slate-950 p-3 text-xs font-mono text-emerald-400 border-none outline-none resize-none" placeholder="Generated HTML/JS code yahan paste karke Run dabayein..."></textarea>
      <iframe id="previewFrame" class="h-1/2 w-full bg-white border-t border-slate-800"></iframe>
    </div>
  </div>

  <script>
    let geminiKey = localStorage.getItem('GEMINI_KEY') || '';

    function setApiKey() {
      const key = prompt("Apni Gemini API Key paste karein:", geminiKey);
      if (key !== null) {
        geminiKey = key.trim();
        localStorage.setItem('GEMINI_KEY', geminiKey);
        alert("API Key save ho gayi!");
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      if (!geminiKey) {
        alert("Pehle upar diye 'Set API Key' button se apni key daalein!");
        return;
      }

      appendMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;
      sendBtn.innerText = '...';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: "You are Nexus Builder, an expert AI coder. Help the user build projects. If code is requested, provide working, single-file HTML/CSS/JS code. User prompt: " + text
              }]
            }]
          })
        });

        const data = await res.json();

        if (data.error) {
          appendMessage("API Error: " + data.error.message, 'bot');
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply) {
            appendMessage(reply, 'bot');
          } else {
            appendMessage("Response empty aaya. Ek baar API key check karein.", 'bot');
          }
        }
      } catch (err) {
        appendMessage("Network Error: " + err.message, 'bot');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send';
      }
    }

    function appendMessage(text, sender) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? "ml-auto p-3 rounded-xl bg-blue-600 text-white text-sm max-w-[85%]" 
        : "p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm max-w-[85%] whitespace-pre-wrap";
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function runCode() {
      const code = document.getElementById('codeEditor').value;
      const frame = document.getElementById('previewFrame').contentWindow.document;
      frame.open();
      frame.write(code);
      frame.close();
    }
  </script>
</body>
</html>
